@import url('https://fonts.googleapis.com/css2?family=Spectral:wght@500;700;800&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap');

:root{
  --navy:#0C2340; --navy-2:#0A1D35; --navy-3:#123055;
  --yellow:#FFCE00; --yellow-2:#F5C400; --yellow-deep:#C99E00;
  --chalk:#F3EFE2; --mist:#93A9C4; --mist-2:#5F7896;
  --under:#E03A2F; --line:rgba(147,169,196,.18);
  --green:#2E6B4F;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--navy-2)}
.bp{min-height:100vh;background:
  radial-gradient(1200px 500px at 50% -200px, #16385f 0%, var(--navy-2) 60%);
  color:var(--chalk);
  font-family:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  padding-bottom:96px}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}

/* masthead */
.mast{padding:26px 0 14px;text-align:center;border-bottom:2px solid var(--yellow)}
.mast .eyebrow{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:10.5px;
  letter-spacing:.24em;color:var(--yellow);text-transform:uppercase;font-weight:600}
.mast h1{font-family:'Spectral',Georgia,serif;font-weight:800;font-size:clamp(30px,7vw,44px);
  line-height:1.04;letter-spacing:.01em;margin:6px 0 4px}
.mast .sub{font-size:12.5px;color:var(--mist);font-weight:500}

/* status strip */
.strip{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;
  padding:10px 0 2px;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;color:var(--mist)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--mist-2);display:inline-block;margin-right:5px}
.dot.live{background:#3DDC84;box-shadow:0 0 8px rgba(61,220,132,.7);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.45}}
.strip button{background:none;border:1px solid var(--line);color:var(--chalk);border-radius:4px;
  font-family:inherit;font-size:11px;padding:4px 10px;cursor:pointer}
.strip button:hover{border-color:var(--yellow);color:var(--yellow)}
.strip button:disabled{opacity:.4;cursor:default}

/* banners */
.banner{margin:12px 0 0;border:1px solid var(--line);border-left:3px solid var(--yellow);
  background:rgba(255,206,0,.06);padding:10px 12px;font-size:12.5px;color:var(--chalk);border-radius:4px;line-height:1.45}
.banner.err{border-left-color:var(--under);background:rgba(224,58,47,.08)}

/* tabs */
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--navy);
  border-top:2px solid var(--yellow);display:flex;justify-content:center}
.tabs .inner{display:flex;width:100%;max-width:760px}
.tabs button{flex:1;background:none;border:none;color:var(--mist);padding:11px 4px 13px;cursor:pointer;
  font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.tabs button.on{color:var(--yellow)}
.tabs button.on span{border-bottom:2px solid var(--yellow);padding-bottom:3px}

/* section heads */
.shead{display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 10px}
.shead h2{font-family:'Spectral',Georgia,serif;font-weight:700;font-size:20px}
.shead .note{font-size:11px;color:var(--mist);font-family:'IBM Plex Mono',monospace}

/* pool plates \u2014 the yellow Open scoreboard */
.plate{background:linear-gradient(180deg,var(--yellow) 0%,var(--yellow-2) 100%);
  color:var(--navy);border-radius:5px;margin-bottom:10px;overflow:hidden;
  box-shadow:0 2px 0 var(--yellow-deep), 0 8px 22px rgba(0,0,0,.35)}
.plate .top{display:flex;align-items:stretch}
.plate .rk{width:52px;min-width:52px;background:var(--navy);color:var(--yellow);display:flex;
  align-items:center;justify-content:center;font-family:'Spectral',Georgia,serif;font-weight:800;font-size:26px}
.plate .mid{flex:1;padding:10px 12px;min-width:0}
.plate .tname{font-family:'Spectral',Georgia,serif;font-weight:800;font-size:21px;line-height:1.05;letter-spacing:.01em}
.plate .tmeta{font-size:11px;font-weight:600;color:#42568F;margin-top:2px;
  font-family:'IBM Plex Mono',monospace;color:rgba(12,35,64,.72)}
.plate .money{padding:10px 14px 10px 8px;text-align:right;display:flex;flex-direction:column;justify-content:center}
.plate .money .amt{font-family:'IBM Plex Mono',ui-monospace,monospace;font-weight:700;font-size:20px;letter-spacing:-.01em}
.plate .money .lbl{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:rgba(12,35,64,.6)}
.plate .roster{border-top:1.5px solid rgba(12,35,64,.25);padding:7px 12px 9px;display:none}
.plate.open .roster{display:block}
.plate .rrow{display:flex;align-items:baseline;gap:8px;font-size:13px;padding:3.5px 0;font-weight:500}
.plate .rrow .rp{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;width:34px;color:rgba(12,35,64,.75)}
.plate .rrow .rn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plate .rrow .rs{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:700;width:34px;text-align:right}
.plate .rrow .rt{font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;width:44px;text-align:right;color:rgba(12,35,64,.72)}
.plate .rrow .rm{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;width:70px;text-align:right}
.plate .caret{font-size:10px;text-align:center;color:rgba(12,35,64,.55);padding:0 0 5px;letter-spacing:.2em}
.redno{color:var(--under)}
.plate .rrow .rs.redno{color:#C42B21}

/* leaderboard table */
.lb{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:rgba(10,29,53,.55)}
.lb .hd,.lb .row{display:grid;grid-template-columns:44px 1fr 44px 46px 40px 78px 44px;
  align-items:center;column-gap:4px;padding:8px 10px}
.lb .hd{background:var(--navy);font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--mist);font-weight:600;position:sticky;top:0}
.lb .row{border-top:1px solid var(--line);font-size:13.5px}
.lb .row.mine{background:rgba(255,206,0,.07)}
.lb .pos{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:12px}
.lb .plr{min-width:0;display:flex;align-items:center;gap:6px}
.lb .plr .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.lb .plr .am{font-size:9px;color:var(--mist);font-family:'IBM Plex Mono',monospace}
.chip{font-family:'IBM Plex Mono',monospace;font-size:8.5px;font-weight:700;letter-spacing:.05em;
  background:var(--yellow);color:var(--navy);border-radius:3px;padding:1.5px 4px;text-transform:uppercase;flex-shrink:0}
.lb .sc,.lb .td,.lb .th{font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:600;text-align:right}
.lb .mn{font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:600;text-align:right;color:var(--chalk)}
.lb .wp{font-family:'IBM Plex Mono',monospace;font-size:11px;text-align:right;color:var(--mist)}
.lb .row.dead{opacity:.45}
.filters{display:flex;gap:8px;margin:0 0 10px;flex-wrap:wrap}
.filters button{background:none;border:1px solid var(--line);color:var(--mist);border-radius:99px;
  padding:5px 12px;font-size:11.5px;font-weight:600;cursor:pointer;font-family:'Archivo',sans-serif}
.filters button.on{border-color:var(--yellow);color:var(--navy);background:var(--yellow)}
.legend{font-size:10.5px;color:var(--mist-2);margin-top:8px;font-family:'IBM Plex Mono',monospace}

/* teams editor */
.tsel{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px}
.tsel button{border:1.5px solid var(--line);background:none;color:var(--chalk);border-radius:5px;
  padding:7px 12px;font-family:'Spectral',Georgia,serif;font-weight:700;font-size:15px;cursor:pointer;white-space:nowrap}
.tsel button .ct{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--mist);display:block;font-weight:500}
.tsel button.on{border-color:var(--yellow);background:var(--yellow);color:var(--navy)}
.tsel button.on .ct{color:rgba(12,35,64,.7)}
.picked{border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:12px;background:rgba(10,29,53,.55)}
.picked .prow{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:14px}
.picked .prow .x{margin-left:auto;background:none;border:1px solid var(--line);color:var(--mist);
  border-radius:4px;width:24px;height:24px;cursor:pointer;font-size:12px;line-height:1}
.picked .prow .x:hover{border-color:var(--under);color:var(--under)}
.picked .empty{color:var(--mist-2);font-size:12.5px;font-style:italic;padding:4px 0}
.search{width:100%;background:var(--navy);border:1.5px solid var(--line);color:var(--chalk);
  border-radius:6px;padding:11px 12px;font-size:15px;font-family:'Archivo',sans-serif;margin-bottom:8px}
.search:focus{outline:none;border-color:var(--yellow)}
.field{border:1px solid var(--line);border-radius:6px;max-height:330px;overflow-y:auto;background:rgba(10,29,53,.55)}
.field .frow{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--line);
  cursor:pointer;font-size:14px}
.field .frow:first-child{border-top:none}
.field .frow:hover{background:rgba(255,206,0,.08)}
.field .frow .taken{margin-left:auto}
.field .frow.disabled{opacity:.4;cursor:default}
.field .none{padding:14px;color:var(--mist-2);font-size:13px}
.mini{font-size:11px;color:var(--mist-2);margin:8px 2px;line-height:1.5}

/* info/settings */
.card{border:1px solid var(--line);border-radius:6px;background:rgba(10,29,53,.55);padding:14px;margin-bottom:12px}
.card h3{font-family:'Spectral',Georgia,serif;font-size:16px;margin-bottom:8px}
.card p{font-size:12.5px;color:var(--mist);line-height:1.55;margin-bottom:6px}
.card label{font-size:11px;font-family:'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--mist)}
.card input[type=text]{width:100%;background:var(--navy);border:1.5px solid var(--line);color:var(--chalk);
  border-radius:5px;padding:9px 10px;font-size:15px;font-family:'IBM Plex Mono',monospace;margin-top:5px}
.card input:focus{outline:none;border-color:var(--yellow)}
.btn{background:var(--yellow);color:var(--navy);border:none;border-radius:5px;padding:9px 16px;
  font-weight:700;font-size:13px;cursor:pointer;font-family:'Archivo',sans-serif}
.btn.ghost{background:none;border:1.5px solid var(--line);color:var(--chalk)}
.btn.ghost:hover{border-color:var(--yellow);color:var(--yellow)}
.btnrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.paytable{width:100%;font-family:'IBM Plex Mono',monospace;font-size:11px;border-collapse:collapse;margin-top:8px}
.paytable td{padding:3px 6px;border-top:1px solid var(--line);color:var(--mist)}
.paytable td:nth-child(2n){text-align:right;color:var(--chalk)}
.switch{display:flex;border:1.5px solid var(--line);border-radius:6px;overflow:hidden;margin-top:8px}
.switch button{flex:1;background:none;border:none;color:var(--mist);padding:9px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Archivo',sans-serif}
.switch button.on{background:var(--yellow);color:var(--navy)}

@media (max-width:420px){
  .lb .hd,.lb .row{grid-template-columns:38px 1fr 42px 40px 34px 72px 40px;padding:8px 6px;column-gap:3px}
  .lb .row{font-size:12.5px}
  .plate .tname{font-size:18px}
  .plate .money .amt{font-size:17px}
  .plate .rrow .rt{width:38px}
  .plate .rrow .rm{width:62px}
}
